# What this workflow does, in short:
# Every time code is pushed (or a pull request is opened to main), GitHub
# starts a fresh Linux machine, installs Python and the project's packages,
# trains the models on the fake (synthetic) sample data, checks that the
# expected output files were created, and then runs the test suite.
# If any step fails, the run is marked red so the problem is caught early.
# It does not deploy anything or use any real data.

name: CI

# When to run: on pushes to main or any feature/... branch,
# and on pull requests that target main.
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

# The workflow may only read the code, not change it.
permissions:
  contents: read

# Cancel an older run on the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pipeline + tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Download the project's code onto the machine.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Python 3.11. Downloaded packages are cached to speed up later runs.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install the packages listed in requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Uses the committed SYNTHETIC dataset (data/sample/synthetic_school_meals.csv).
      # No real Food4Education data is used or needed. The full run, tuning
      # included, takes well under a minute on this dataset.
      # The real Food4Education sheet is private and not available here, so the
      # synthetic sample is named explicitly (training no longer falls back to it).
      - name: Run ML pipeline (synthetic data)
        run: python scripts/train_models.py --data-path data/sample/synthetic_school_meals.csv

      # Make sure training produced every expected file and none is empty.
      # Fails the run if any file is missing.
      - name: Check pipeline artifacts exist
        run: |
          for f in \
            data/processed/school_meals_processed.csv \
            models/final_best_model.joblib \
            models/final_best_model_metadata.json \
            reports/metrics/baseline_model_metrics.csv \
            reports/metrics/tuned_model_metrics.csv; do
            test -s "$f" || { echo "Missing or empty artifact: $f"; exit 1; }
          done
          echo "All pipeline artifacts present."

      # Checks the Django project configuration (settings, URLs, apps) loads
      # without errors before the tests run.
      - name: Django system check
        run: python manage.py check

      # Fails if a model change has no matching migration file.
      - name: Django migration consistency check
        run: python manage.py makemigrations --check --dry-run

      # Runs after the pipeline so tests that use the saved development model
      # and metrics find them (they skip when those artifacts are missing).
      - name: Run tests
        run: pytest -q
