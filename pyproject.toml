[project]
name = "bitetracker"
version = "1.0.0"
description = "Proactive School Meal Planning: Time Series Forecasting for Food Demand Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharon Kanyi" }]
dependencies = [
    "pandas==2.3.3",
    "numpy==2.0.2",
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "statsmodels==0.14.6",
    "plotly==6.9.0",
    "Django==5.2.17",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
    "joblib==1.5.3",
    "python-dotenv==1.2.1",
    "tabulate==0.9.0",
    "openpyxl==3.1.5",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-django==4.14.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "bitetracker_web.settings"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
