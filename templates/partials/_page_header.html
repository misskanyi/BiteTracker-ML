{# Usage: {% include "partials/_page_header.html" with title="…" icon="bi-…" subtitle="…" %} #}
<div class="bt-page-header">
  <span class="bt-icon-chip" aria-hidden="true"><i class="bi {{ icon }}"></i></span>
  <div>
    <h1 class="bt-page-title">{{ title }}</h1>
    {% if subtitle %}<p class="bt-page-subtitle">{{ subtitle }}</p>{% endif %}
  </div>
</div>
