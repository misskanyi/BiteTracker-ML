# Nginx reverse proxy for BiteTracker.
# Install: sudo cp deploy/nginx/bitetracker.conf /etc/nginx/sites-available/bitetracker
#          sudo ln -s /etc/nginx/sites-available/bitetracker /etc/nginx/sites-enabled/bitetracker
#          sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# Replace bitetracker.example.org with your domain. For HTTPS run:
#          sudo certbot --nginx -d bitetracker.example.org
# (certbot adds the 443 server block and the HTTP -> HTTPS redirect to this file).

upstream bitetracker_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitetracker.example.org;

    # Dataset uploads are capped at 10 MB by Django; leave a little headroom.
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/bitetracker.access.log;
    error_log  /var/log/nginx/bitetracker.error.log;

    # Collected static files (hashed names, so they can be cached for a long time).
    location /static/ {
        alias /opt/bitetracker/current/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded files are private and never served directly.
    location /media/ {
        return 404;
    }

    location = /health/ {
        proxy_pass http://bitetracker_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://bitetracker_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always overwritten here, so clients cannot spoof HTTPS to Django.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
